<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tornado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .app-splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:stretch;justify-content:stretch;background:#000;opacity:0;pointer-events:none;transition:opacity 180ms ease-out}
    .app-splash--visible{opacity:1;pointer-events:auto}
    .app-splash--dismissed{opacity:0;pointer-events:none}
    .app-splash__stage{position:relative;display:flex;flex-direction:column;justify-content:space-between;width:100%;height:100%;max-width:100vw;max-height:100dvh;padding:max(1.5rem,env(safe-area-inset-top,0px)) 1.5rem max(1.75rem,calc(1rem + env(safe-area-inset-bottom,0px)));box-sizing:border-box;overflow:hidden;background:radial-gradient(ellipse 55% 36% at 50% 46%,rgba(252,211,18,.06) 0%,transparent 70%),#000}
    .app-splash__center{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:1}
    .app-splash__logo-wrap{display:flex;align-items:center;justify-content:center;width:5.5rem;height:6rem;pointer-events:none}
    .app-splash__logo{display:block;width:100%;height:100%;object-fit:contain;user-select:none;pointer-events:none}
    .app-splash__brand{position:relative;z-index:2;margin-top:auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;width:100%;flex:0 0 auto;gap:.4rem}
    .app-splash__wordmark{display:block;width:min(72%,15.5rem);height:auto;max-height:2.75rem;object-fit:contain;object-position:center;user-select:none;pointer-events:none}
    .app-splash__subtitle{margin:0;padding:0;font-family:Inter,system-ui,sans-serif;font-size:clamp(.875rem,3.6vw,1rem);font-weight:600;letter-spacing:.01em;line-height:1.25;color:#fff}
    .app-splash__tagline{margin:0;padding:0 .75rem;max-width:17rem;font-family:Inter,system-ui,sans-serif;font-size:clamp(.625rem,2.6vw,.71875rem);font-weight:500;letter-spacing:.02em;line-height:1.4;color:rgba(255,255,255,.46)}
  </style>
</head>
<body>
  <div id="app-root"></div>

  <script>
    (function () {
      var THRESHOLD_MS = 375;
      var WORDMARK_URL = '/assets/tornado%20full%20name%20logo%201.webp';
      var LOGO_URL = '/assets/ava%20icon%20tornado%20main.webp';

      window.__tornadoSplash = {
        ready: false,
        el: null,
        stack: null,
        raf: 0,
        stop: null,
        timer: setTimeout(function () {
          if (window.__tornadoSplash.ready || window.__tornadoSplash.el) return;
          var root = document.getElementById('app-root');
          if (!root) return;

          var splash = document.createElement('div');
          splash.className = 'app-splash';
          splash.setAttribute('aria-hidden', 'true');
          splash.innerHTML =
            '<div class="app-splash__stage">' +
              '<div class="app-splash__center">' +
                '<div class="app-splash__logo-wrap">' +
                  '<img class="app-splash__logo" src="' + LOGO_URL + '" alt="" draggable="false" decoding="async" />' +
                '</div>' +
              '</div>' +
              '<div class="app-splash__brand">' +
                '<img class="app-splash__wordmark" src="' + WORDMARK_URL + '" alt="Tornado" draggable="false" decoding="async" />' +
                '<p class="app-splash__subtitle">Kazakhstan Casino App</p>' +
                '<p class="app-splash__tagline">Provably Fair • Secure • Instant Crypto Deposits</p>' +
              '</div>' +
            '</div>';

          root.appendChild(splash);
          void splash.offsetWidth;
          splash.classList.add('app-splash--visible');
          window.__tornadoSplash.el = splash;
        }, THRESHOLD_MS)
      };
    })();
  </script>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    /* Early Telegram.WebApp.ready() — no launch diagnostics in production. */
    (function () {
      try {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (tg && typeof tg.ready === 'function') {
          tg.ready();
          window.__tornadoTelegramReady = true;
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
  <script type="module" src="/static/src/app/main.js"></script>
</body>
</html>
